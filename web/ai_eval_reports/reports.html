<body>
  <header class="topbar">

      <h1 class="topbar-title">Mjolnir AI Pre-Review Reports (caliptra-sw)</h1>

      <button type="button" class="tab-btn" id="tab-v2-scorecard" data-doc="v2_scorecard">v2 Scorecard</button>

      <button type="button" class="tab-btn" id="tab-v1-report" data-doc="v1_report">Pre-Review v1 Report (Deprecated)</button>

      </article>
      <article class="figure-card">
        <h3>RQ4: Token Pathology Distribution</h3>
        <img class="figure-img" id="img-rq4-path" src="./docs/plots/fig_rq4_token_pathology.svg" alt="RQ4 Token Pathology">
      </article>
    </section>

    <article class="doc-card">
      <div class="md-body" id="report-markdown-mount">Loading report...</div>
    </article>
  </main>

  <script type="module" src="./reports.js"></script>
