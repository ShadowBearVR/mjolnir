$schema: "http://json-schema.org/draft-07/schema#"
title: Agent Manifest Schema
type: object
properties:
  name:
    type: string
    description: The name of the custom agent.
  description:
    type: string
    description: A brief description of the agent's purpose.
  allowed_tools:
    type: array
    items:
      type: string
    description: A list of tools the agent is allowed to use.
  supported_backends:
    type: array
    items:
      type: string
    description: Validated LLM backends that this agent supports (e.g., Gemini, Claude).
  system_prompt:
    type: string
    description: The core instructions for the agent, defining its role and focus.
  version:
    type: string
    description: The version of the manifest schema this agent adheres to.
required:
  - name
  - description
  - allowed_tools
  - supported_backends
  - system_prompt
  - version
